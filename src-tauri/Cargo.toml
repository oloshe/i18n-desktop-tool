[package]
name = "i18n-desktop-tool"
version = "0.1.0"
description = "Desktop i18n import tool"
authors = ["Codex"]
edition = "2021"

[lib]
name = "i18n_desktop_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
